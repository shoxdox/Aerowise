# Local development stack: `docker compose up`, then `docker compose run --rm api pnpm db:seed`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aerowise
      POSTGRES_PASSWORD: aerowise
      POSTGRES_DB: aerowise
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aerowise"]
      interval: 2s
      retries: 30

  api:
    build: .
    command: pnpm --filter @aerowise/api start
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://aerowise:aerowise@db:5432/aerowise
      API_PORT: "4000"
      FILE_STORAGE_DIR: /data/files
    volumes: [file-data:/data/files]
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    command: pnpm --filter @aerowise/worker start
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://aerowise:aerowise@db:5432/aerowise
      FILE_STORAGE_DIR: /data/files
    volumes: [file-data:/data/files]
    depends_on:
      db: { condition: service_healthy }
    # Healthy while the worker keeps finishing passes of its loop (see docs/engineering/DEPLOY.md).
    healthcheck:
      test: ["CMD", "pnpm", "--filter", "@aerowise/worker", "health"]
      interval: 30s
      timeout: 20s
      start_period: 60s
      retries: 3

  web:
    build: .
    command: pnpm --filter @aerowise/web start
    # The synthetic test map (not real streets); see docs/engineering/MAP.md for a real extract.
    environment:
      MAP_TILES_FILE: e2e/fixtures/map-fixture.pmtiles
    restart: unless-stopped
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  db-data:
  file-data:
