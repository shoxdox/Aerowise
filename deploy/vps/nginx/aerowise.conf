# Aerowise behind an nginx that already owns ports 80 and 443 on the server. setup.sh installs
# this as /etc/nginx/sites-available/aerowise.conf (STAGING_HOST and PRODUCTION_HOST replaced),
# then certbot adds the certificates and the HTTP-to-HTTPS redirect. Each environment's web app
# listens on the server itself only (AW_WEB_PORT in its settings file).

server {
    listen 80;
    listen [::]:80;
    server_name STAGING_HOST;
    location / {
        proxy_pass http://127.0.0.1:3101;
        include /etc/nginx/aerowise-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name PRODUCTION_HOST;
    location / {
        proxy_pass http://127.0.0.1:3102;
        include /etc/nginx/aerowise-proxy.conf;
    }
}
