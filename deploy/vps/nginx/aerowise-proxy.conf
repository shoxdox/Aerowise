# Shared by both Aerowise sites (/etc/nginx/aerowise-proxy.conf).
proxy_http_version 1.1;
proxy_set_header Host $host;
# Replace, never append: the app trusts this address for sign-in limits, so a client must not
# be able to put its own value first.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# Technician photos are up to 15 MB and spreadsheet imports up to 10 MB.
client_max_body_size 20m;
proxy_read_timeout 120s;
