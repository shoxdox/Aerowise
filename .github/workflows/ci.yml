name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aerowise
          POSTGRES_PASSWORD: aerowise
          POSTGRES_DB: aerowise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aerowise"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://aerowise:aerowise@localhost:5432/aerowise
      TEST_DATABASE_URL: postgres://aerowise:aerowise@localhost:5432/aerowise_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any high or critical advisory in a package the app runs with.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - name: Render Blueprint matches Render's schema
        run: |
          if ! curl -sSf --retry 3 -o "$RUNNER_TEMP/render.schema.json" https://render.com/schema/render.yaml.json; then
            echo "::warning::Could not download Render's Blueprint schema; render.yaml was not validated"
            exit 0
          fi
          npx --yes -p ajv-cli@5 -p ajv-formats@3 ajv validate --spec=draft2020 --strict=false -c ajv-formats -s "$RUNNER_TEMP/render.schema.json" -d render.yaml
      - run: pnpm typecheck
      - run: pnpm test
      - name: Seed runs cleanly
        run: pnpm db:seed
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The self-hosted server's files (docs/engineering/DEPLOY.md): the scripts pass shellcheck,
      # both Compose files resolve, and Caddy and nginx accept their configs.
      - run: shellcheck -S warning deploy/vps/*.sh scripts/deploy-vps.sh scripts/ci-deploy.sh
      - run: AW_ENV=staging AW_DOMAIN=staging.example.com POSTGRES_PASSWORD=x FILE_SIGNING_SECRET=x docker compose -f deploy/vps/app.compose.yaml config -q
      - run: STAGING_DOMAIN=staging.example.com PRODUCTION_DOMAIN=app.example.com ACME_EMAIL=ops@example.com docker compose -f deploy/vps/edge.compose.yaml config -q
      - run: >-
          docker run --rm -v "$PWD/deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro"
          -e STAGING_DOMAIN=staging.example.com -e PRODUCTION_DOMAIN=app.example.com -e ACME_EMAIL=ops@example.com
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: >-
          sed -e s/STAGING_HOST/staging.example.com/ -e s/PRODUCTION_HOST/app.example.com/ deploy/vps/nginx/aerowise.conf > "$RUNNER_TEMP/aerowise.conf" &&
          docker run --rm -v "$RUNNER_TEMP/aerowise.conf:/etc/nginx/conf.d/aerowise.conf:ro"
          -v "$PWD/deploy/vps/nginx/aerowise-proxy.conf:/etc/nginx/aerowise-proxy.conf:ro" nginx:alpine nginx -t
      # The README's Docker path, exactly as written, then a smoke test through the web app.
      - run: docker compose up -d --build
      - run: docker compose run --rm api pnpm db:seed
      - run: ./scripts/compose-smoke.sh
      - if: failure()
        run: docker compose logs --no-color

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aerowise
          POSTGRES_PASSWORD: aerowise
          POSTGRES_DB: aerowise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aerowise"
          --health-interval 2s
          --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://aerowise:aerowise@localhost:5432/aerowise_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aerowise/web exec playwright install --with-deps chromium
      - run: pnpm --filter @aerowise/web build
      - name: Offline sync end-to-end test
        run: pnpm --filter @aerowise/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results

  # Every push to main that passes the jobs above goes to staging (docs/engineering/DEPLOY.md).
  # Skips with a notice until the server's secrets are added.
  deploy-staging:
    needs: [check, docker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/ci-deploy.sh staging "$GITHUB_SHA"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
